<!DOCTYPE html>
<html>
<head>
    <title>To Do List</title>
</head>
<body>

    <h1>My To Do List</h1>

    <!-- Add Task Form -->
    <form method="POST">
        {% csrf_token %}
        <input type="text" name="title"
               placeholder="Enter task" required>
        <button type="submit">Add</button>
    </form>

    <!-- Display Tasks -->
    {% for task in tasks %}

        <p>
            {{ task.title }}

            <!-- Complete Task Form -->
            <form method="POST"
                  action="{% url 'complete' task.id %}">
                {% csrf_token %}
                <button type="submit">
                    {% if task.completed %}
                        Undo
                    {% else %}
                        Complete
                    {% endif %}
                </button>
            </form>

            <!-- Delete Task Form -->
            <form method="POST"
                  action="{% url 'delete' task.id %}">
                {% csrf_token %}
                <button type="submit">Delete</button>
            </form>

        </p>

    {% empty %}
        <p>No tasks available.</p>
    {% endfor %}

</body>
</html>
